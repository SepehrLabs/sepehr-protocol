[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
ffi = false
ast = true
extra_output = ["abi", "evm.bytecode"]
extra_output_files = ["abi"]
fs_permissions = [
    { access = "read", path = "../shared/config" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"
sort_imports = true

[profile.ci]
verbosity = 2
fuzz = { runs = 1000 }
invariant = { runs = 500, depth = 50 }

[profile.dev]
via_ir = false
optimizer = false

[profile.fork-ethereum]
eth_rpc_url = "${RPC_ETHEREUM_PRIMARY_HTTP}"
fork_block_number = 0

[profile.fork-base]
eth_rpc_url = "${RPC_BASE_PRIMARY_HTTP}"
fork_block_number = 0

[profile.fork-arbitrum]
eth_rpc_url = "${RPC_ARBITRUM_PRIMARY_HTTP}"
fork_block_number = 0

[invariant]
runs = 256
depth = 30
fail_on_revert = false
