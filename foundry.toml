[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
ffi = false
ast = true
extra_output = ["abi", "evm.bytecode"]
extra_output_files = ["abi"]
fs_permissions = [
    { access = "read-write", path = "./deployments" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"
sort_imports = true

[profile.ci]
verbosity = 2
fuzz = { runs = 1000 }
invariant = { runs = 500, depth = 50 }

[profile.dev]
via_ir = false
optimizer = false

[profile.fork-ethereum]
eth_rpc_url = "${RPC_ETHEREUM_PRIMARY_HTTP}"
fork_block_number = 0

[profile.fork-base]
eth_rpc_url = "${RPC_BASE_PRIMARY_HTTP}"
fork_block_number = 0

[profile.fork-arbitrum]
eth_rpc_url = "${RPC_ARBITRUM_PRIMARY_HTTP}"
fork_block_number = 0

[profile.fork-arbitrum-sepolia]
eth_rpc_url = "${RPC_ARBITRUM_SEPOLIA_PRIMARY_HTTP}"
fork_block_number = 0

[invariant]
runs = 256
depth = 30
fail_on_revert = false

# ADR-0011: V1 mono-Arbitrum. Deploy scripts resolve --rpc-url by key against these
# endpoints, so `forge script script/DeployCore.s.sol --rpc-url arbitrum-sepolia --broadcast`
# picks up RPC_ARBITRUM_SEPOLIA_PRIMARY_HTTP from the environment.
[rpc_endpoints]
arbitrum-one = "${RPC_ARBITRUM_PRIMARY_HTTP}"
arbitrum-sepolia = "${RPC_ARBITRUM_SEPOLIA_PRIMARY_HTTP}"

# Arbiscan covers both Arbitrum One and Arbitrum Sepolia under a single V2 API key.
# `forge script ... --verify --etherscan-api-key $ARBISCAN_API_KEY --chain arbitrum-sepolia`
# resolves through this section.
[etherscan]
arbitrum-one = { key = "${ARBISCAN_API_KEY}", chain = 42161, url = "https://api.arbiscan.io/api" }
arbitrum-sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614, url = "https://api-sepolia.arbiscan.io/api" }
